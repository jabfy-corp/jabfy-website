name: Validate PR-Issue Link

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR is linked to an existing issue
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          pr_body=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.body // ""')
          issue_numbers=$(printf '%s\n' "$pr_body" \
            | grep -Eio '(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]+#[0-9]+' \
            | sed -E 's/.*#//' \
            | sort -u || true)

          if [[ -z "$issue_numbers" ]]; then
            echo "ERROR: Pull request must contain a closing reference."
            echo "Use a closing keyword in the PR body, e.g.: Closes #123"
            exit 1
          fi

          issue_count=0
          while IFS= read -r issue_number; do
            [[ -z "$issue_number" ]] && continue
            issue_data=$(gh api "repos/$REPO/issues/$issue_number")

            if ! jq -e '.pull_request == null' <<< "$issue_data" >/dev/null; then
              echo "ERROR: #$issue_number is a pull request, not an issue."
              exit 1
            fi

            ((issue_count += 1))
          done <<< "$issue_numbers"

          echo "PR closes $issue_count existing issue(s). Validation passed."
